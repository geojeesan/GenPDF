<!DOCTYPE html>
<html lang="en" data-platform="fluent" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenPDF Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/fluent.css" />
    <link rel="stylesheet" href="./src/styles/gtk4.css" />
    <link rel="stylesheet" href="./src/styles/annotations.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar-region" id="titlebar-container">
        <div class="titlebar-drag-region">
          <div class="titlebar-left">
            <div class="app-logo" title="GenPDF Studio">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <path d="M12 18v-6"></path>
                <path d="m9 15 3 3 3-3"></path>
              </svg>
            </div>
          </div>
          <nav class="tabs-region" id="tabs-container"></nav>
          <div class="titlebar-drag-spacer"></div>
          <div class="titlebar-right"></div>
        </div>
      </header>
      <section class="toolbar-region" id="toolbar-container"></section>
      <main class="workspace-region">
        <aside class="sidebar-region" id="sidebar-container"></aside>
        <section class="viewport-region" id="viewport-container"></section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
